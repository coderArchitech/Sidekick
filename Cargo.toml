# Cargo workspace. Each Rust module from the tech doc (section 3.2) is its own
# crate under crates/; src-tauri is the thin app shell that wires them to Tauri.
# See docs/adr/0011-cargo-workspace.md.
[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
sidekick-core = { path = "crates/core" }
sidekick-secrets = { path = "crates/secrets" }
sidekick-store = { path = "crates/store" }
sidekick-settings = { path = "crates/settings" }
sidekick-gateway = { path = "crates/gateway" }
sidekick-audio = { path = "crates/audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
secrecy = "0.10"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2"
sqlite-vec = "0.1.6"
getrandom = "0.3"
hex = "0.4"
tempfile = "3"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
fastrand = "2"
wiremock = "0.6"
cpal = "0.18"
hound = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
