[package]
name = "sidekick-app"
description = "Tauri app shell: registers IPC commands and wires the domain crates together. No business logic lives here."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sidekick_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Local Whisper speech-to-text (builds whisper.cpp; needs CMake and a C++ compiler).
local-whisper = ["sidekick-stt/local-whisper"]
# End-to-end tests only (T-033): an embedded WebDriver server and the WDIO
# helper plugin. Never in a release build; see tests/e2e/README.md.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri-plugin-wdio = { version = "1.5", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }
sidekick-core = { workspace = true, features = ["specta"] }
sidekick-secrets = { workspace = true, features = ["specta"] }
sidekick-store.workspace = true
sidekick-settings = { workspace = true, features = ["specta"] }
sidekick-gateway = { workspace = true, features = ["specta"] }
tokio.workspace = true
sidekick-stt = { workspace = true, features = ["specta"] }
reqwest.workspace = true
sidekick-window = { workspace = true, features = ["specta"] }
sidekick-diagnostics = { workspace = true, features = ["specta"] }
sidekick-session = { workspace = true, features = ["specta"] }
sidekick-audio.workspace = true
sidekick-hotkeys = { workspace = true, features = ["specta"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
sidekick-ingest = { workspace = true, features = ["specta"] }
sidekick-retrieval = { workspace = true, features = ["specta"] }
sidekick-capture = { workspace = true, features = ["specta"] }
sidekick-skills = { workspace = true, features = ["specta"] }
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
