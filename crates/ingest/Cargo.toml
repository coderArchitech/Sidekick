[package]
name = "sidekick-ingest"
description = "Turns documents into searchable chunks: parse (PDF, DOCX, PPTX, XLSX, TXT, MD, web pages), split into ~500-token chunks with page numbers, embed in batches, and store."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
specta = ["dep:specta"]

[dependencies]
sidekick-core.workspace = true
sidekick-store.workspace = true
sidekick-secrets.workspace = true
sidekick-gateway.workspace = true
calamine.workspace = true
hex.workspace = true
pdf-extract.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true
specta = { workspace = true, optional = true }

[dev-dependencies]
lopdf.workspace = true
tempfile.workspace = true
wiremock.workspace = true
async-trait.workspace = true

[lints]
workspace = true
