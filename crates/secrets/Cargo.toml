[package]
name = "sidekick-secrets"
description = "Reads, writes and deletes secrets (provider API keys, the database key) in the OS keychain. Never returns full keys over IPC."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
specta = ["dep:specta", "sidekick-core/specta"]

[dependencies]
sidekick-core.workspace = true
secrecy.workspace = true
serde.workspace = true
specta = { workspace = true, optional = true }

# Native backends only: Keychain on macOS, Credential Manager on Windows,
# kernel keyutils on Linux (dev and CI only; no D-Bus dependency).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
