[package]
name = "sidekick-stt"
description = "Streaming speech-to-text: SttProvider interface, Deepgram adapter, mock provider, reconnects with audio buffering, speaker labels."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
specta = ["dep:specta"]
# Local Whisper via whisper.cpp (needs CMake and a C++ compiler to build).
local-whisper = ["dep:whisper-rs"]

[dependencies]
sidekick-core.workspace = true
sidekick-audio.workspace = true
sidekick-secrets.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
sha1 = "0.10"
sha2.workspace = true
hex.workspace = true
specta = { workspace = true, optional = true }
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }
wiremock.workspace = true
tempfile.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true
sidekick-diagnostics.workspace = true

[lints]
workspace = true
