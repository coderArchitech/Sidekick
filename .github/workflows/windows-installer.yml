# Builds unsigned Windows installers (.msi and setup .exe) on a Windows runner
# and keeps them as a downloadable artifact. Signing comes with T-037.
name: Windows installer

on:
  # Run it from the Actions tab once this file is on main.
  workflow_dispatch:
  # Until then, pushing a change to this file builds from that branch.
  push:
    paths:
      - .github/workflows/windows-installer.yml

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned version on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the app and both installers
        run: pnpm tauri build --bundles msi,nsis
      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: sidekick-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
